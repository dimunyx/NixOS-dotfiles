palette = "noctalia"
add_newline = false

format = """
$hostname$username$directory$git_branch$cmd_duration
$env_var"""

[env_var.STARSHIP_SHELL]
format = '[](bold fg:blue)[$env_value](bold bg:blue)[](bold fg:blue)'
disabled = false

[git_branch]
symbol = "󰘬"
format = "[](bold fg:blue)[$symbol $branch(:$remote_branch)](fg:text bg:blue)[](bold fg:blue)"

[git_commit]
commit_hash_length = 4
tag_symbol = "  "

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[](bold fg:blue)[$hostname](bg:blue bold fg:text)[@](bold bg:blue fg:text)"
trim_at = ".companyname.com"
disabled = false

[username]
format = "[](bold)[$user](bold fg:text bg:blue)[](bold fg:blue)"
disabled = false
show_always = true

[directory]
home_symbol = ""
read_only = ""
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:blue)[$path](bold fg:text bg:blue)[](bold fg:blue)'

[directory.substitutions]
"Рабочий стол" = ""
"Документы" = "󰈙"
"Загрузки" = ""
"Музыка" = ""
"Изображения" = ""
"Видео" = ""
"GitHub" = "󰊤"
"Игры" = ""
"Общедоступные" = "󰀃"
"Проекты" = "󰐯"
"Шаблоны" = ""
".config" = ""
".icons" = ""

[cmd_duration]
min_time = 0
format = '[](bold fg:blue)[ $duration](bold bg:blue fg:text)[](bold fg:blue)'
disabled = false

